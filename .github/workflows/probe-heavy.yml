# 무게 대조군. probe-oclock과 **완전히 같은 시각(0 0)** 에 선다.
# 다른 점은 하는 일의 무게뿐이다:
#   - 8분쯤 돈다 (release-tracker의 아침 추적과 비슷)
#   - 리포에 커밋을 남긴다 (스냅샷 커밋 흉내)
#   - 끝나면 workflow_run으로 후속 워크플로를 깨운다 (캘린더 연쇄 흉내)
# 같은 분에 가벼운 것과 무거운 것이 나란히 서므로, 지연 차이가 나면
# 그건 무게 때문이다. 시크릿도 노션도 쓰지 않는다.
name: probe-heavy

on:
  schedule:
    - cron: "0 0 * * *"     # 09:00 KST — probe-oclock과 동일
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heavy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 시작 시각
        run: date -u +"started %Y-%m-%dT%H:%M:%SZ (target 00:00Z, heavy)"

      # 진짜 작업 대신 시간만 쓴다. 외부 API를 부르지 않으므로
      # 남의 서비스에 부담을 주지 않는다.
      - name: 8분 점유
        run: |
          for i in $(seq 1 8); do
            echo "minute $i/8  $(date -u +%H:%M:%S)"
            sleep 60
          done

      - name: 상태 파일 커밋 (스냅샷 흉내)
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" >> heartbeat.txt
          tail -n 30 heartbeat.txt > heartbeat.tmp && mv heartbeat.tmp heartbeat.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "probe heartbeat $(date -u +%Y-%m-%d)" || exit 0
          git push
