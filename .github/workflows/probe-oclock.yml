# 정각 슬롯. release-tracker의 아침 추적(daily.yml)과 완전히 같은 시각에 선다.
# 목적: 우리 리포만 밀리는 것인지, GitHub 전체가 밀리는 것인지 가른다.
name: probe-oclock

on:
  schedule:
    - cron: "0 0 * * *"     # 09:00 KST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 실제로 돌기 시작한 시각
        run: date -u +"started %Y-%m-%dT%H:%M:%SZ (target 00:00Z)"
